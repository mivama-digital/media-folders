name: Build release ZIP

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Validate and build release ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Test and build JavaScript
        run: |
          npm ci
          npm test -- --run
          npm run build

      - name: Test PHP
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          composer test

      - name: Install production PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Archive release
        uses: thedoctor0/zip-release@b57d897cb5d60cb78b51a507f63fa184cfe35554
        with:
          type: zip
          filename: virtual-media-folders.zip
          exclusions: >-
            *.git*
            .github/*
            .distignore
            .editorconfig
            .wordpress-org/*
            assets/*
            docs/*
            tests/*
            scripts/*
            src/admin/*
            src/editor/*
            src/shared/*
            *.md
            package.json
            package-lock.json
            webpack.config.js
            vitest.config.js
            phpunit.xml.dist
            composer.lock
            phpcs.xml
            i18n-map.json

      - name: Attach ZIP to release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: virtual-media-folders.zip
          tag_name: ${{ github.event.release.tag_name }}
