name: Release prep temp

on:
  push:
    branches:
      - agent/release-2.1.6-prep

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Prepare 2.1.6 metadata and docs
        run: |
          npm version 2.1.6 --no-git-tag-version --allow-same-version
          python3 - <<'PY'
          from pathlib import Path

          plugin = Path('virtual-media-folders.php')
          text = plugin.read_text()
          text = text.replace(' * Version: 2.1.5', ' * Version: 2.1.6', 1)
          text = text.replace("define( 'VMFO_VERSION', '2.1.5' );", "define( 'VMFO_VERSION', '2.1.6' );", 1)
          plugin.write_text(text)

          readme = Path('readme.txt')
          text = readme.read_text()
          text = text.replace('Stable tag: 2.1.5', 'Stable tag: 2.1.6', 1)
          text = text.replace('https://github.com/soderlind/virtual-media-folders/blob/main/docs/a11y.md', 'https://github.com/mivama-digital/media-folders/blob/main/docs/a11y.md')
          text = text.replace('https://github.com/soderlind/virtual-media-folders/blob/main/docs/development.md', 'https://github.com/mivama-digital/media-folders/blob/main/docs/development.md')
          text = text.replace('https://github.com/soderlind/virtual-media-folders/blob/main/docs/addon-development.md', 'https://github.com/mivama-digital/media-folders/blob/main/docs/addon-development.md')
          text = text.replace('https://github.com/soderlind/virtual-media-folders/issues/new', 'https://github.com/mivama-digital/media-folders/issues/new')
          marker = '== Changelog ==\n\n'
          section = '''= 2.1.6 =\n* Security: Hardened the JavaScript and Composer supply chain to a zero-advisory baseline without force-fixes or peer-resolution bypasses.\n* Changed: Replaced the broad `@wordpress/scripts` meta-toolchain with the focused build/test dependencies actually used by the plugin.\n* Changed: Updated the supported WordPress runtime package set, PHPUnit 12, Webpack CLI 7, babel-loader 10, and the Vite 8 test stack while retaining the validated React 18 host contract.\n* Distribution: The plugin ZIP now uses the plugin-owned PHP autoloader and ships without a Composer `vendor/` tree; release CI validates SBOMs, SHA-256 checksums, bundle budgets, and required files.\n* Documentation: Updated maintained-repository links and release instructions for the Mivama distribution.\n\n'''
          if '= 2.1.6 =' not in text:
              text = text.replace(marker, marker + section, 1)
          readme.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          marker = '## [2.1.5] - 2026-08-26\n'
          section = '''## [2.1.6] - 2026-08-31\n\n### Security\n\n- Hardened the JavaScript and Composer supply chain to a zero-advisory baseline without `--force`, `--legacy-peer-deps`, or dependency overrides.\n- Enforced exact install-script approvals, GPL-compatible runtime-license validation, and blocking npm/Composer security gates.\n\n### Changed\n\n- Replaced the broad `@wordpress/scripts` meta-package with the focused Webpack/Babel/PostCSS/Vitest toolchain actually used by the plugin.\n- Updated the directly pinned WordPress runtime packages to their current compatible same-major releases.\n- Upgraded PHPUnit to 12, Webpack CLI to 7, babel-loader to 10, the CSS toolchain majors, and the Vite React adapter to Vite 8 while retaining the validated React 18 WordPress host contract.\n- Updated maintained-repository documentation links and release instructions for the Mivama distribution.\n\n### Distribution\n\n- Switched the shipped PHP runtime to the plugin-owned autoloader and removed the Composer `vendor/` tree from the WordPress distribution ZIP.\n- Added runtime CycloneDX SBOM validation, SHA-256 checksums, version consistency checks, bundle budgets, and required-file validation to release CI.\n- Kept WordPress.org deployment manual, confirmation-gated, and dry-run by default.\n\n'''
          if '## [2.1.6]' not in text:
              text = text.replace(marker, section + marker, 1)
          changelog.write_text(text)

          readme_md = Path('README.md')
          text = readme_md.read_text()
          text = text.replace('Go to **Media > Folder Settings**', 'Go to **Media > VMF Settings**')
          text = text.replace('### Mivama release\n\n1. Open the [Mivama releases](https://github.com/mivama-digital/media-folders/releases) page.\n2. Download the `virtual-media-folders.zip` asset from the desired release.\n3. In WordPress, go to **Plugins > Add New > Upload Plugin**.\n4. Upload the ZIP and activate the plugin.', '### Mivama release\n\nWhen a Mivama release is published:\n\n1. Open the [Mivama releases](https://github.com/mivama-digital/media-folders/releases) page.\n2. Download the `virtual-media-folders.zip` asset from the desired release.\n3. In WordPress, go to **Plugins > Add New > Upload Plugin**.\n4. Upload the ZIP and activate the plugin.\n\nUntil the first Mivama release is published, treat `main` as development source rather than a stable binary distribution.')
          old = '''To build the same release archive locally after producing assets and installing production PHP dependencies:\n\n```bash\nnpm run build\ncomposer install --no-dev --prefer-dist --optimize-autoloader\nnpm run package:zip\n```'''
          new = '''To validate and build the same vendor-free release archive locally:\n\n```bash\nnpm ci\ncomposer install --prefer-dist --no-interaction --no-progress\nnpm test -- --run\ncomposer test\nnpm run build\nnpm run check:release-version\nnpm run check:bundle-budget\nnpm run check:php-runtime-autoload\nnpm run package:zip\n```\n\nThe distributable ZIP intentionally excludes Composer package-manager metadata and `vendor/`; Composer remains a development/test dependency only. See [docs/development.md](docs/development.md) for the complete release smoke-test sequence.'''
          text = text.replace(old, new)
          readme_md.write_text(text)

          dev = Path('docs/development.md')
          text = dev.read_text().replace('`vitest.config.js` aliases host-provided WordPress modules', '`vitest.config.mjs` aliases host-provided WordPress modules')
          dev.write_text(text)
          PY

      - name: Commit prepared release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json virtual-media-folders.php readme.txt CHANGELOG.md README.md docs/development.md
          git commit -m "chore: prepare 2.1.6 release metadata"
          git push
