name: Update WordPress.org assets (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to confirm the WordPress.org asset/readme update
        required: true
        type: string

permissions:
  contents: read

jobs:
  update:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update WordPress.org plugin assets and readme
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          IGNORE_OTHER_FILES: true
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
