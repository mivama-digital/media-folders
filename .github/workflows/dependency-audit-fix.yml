name: Dependency audit fix bootstrap

on:
  push:
    branches:
      - agent/dependency-hygiene
    paths:
      - '.github/workflows/dependency-audit-fix.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

env:
  NODE_VERSION: '24'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/dependency-hygiene

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked graph
        run: npm ci

      - name: Apply only non-breaking audit fixes
        run: npm audit fix

      - name: Verify install-script policy
        run: npm run security:install-scripts

      - name: Verify runtime audit
        run: npm run security:audit:runtime

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Verify release invariants
        run: |
          npm run check:release-version
          npm run check:bundle-budget

      - name: Commit resolver changes
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No non-breaking npm audit fixes are available.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore: apply non-breaking npm audit fixes [dependency-fix]'
          git push origin HEAD:agent/dependency-hygiene
