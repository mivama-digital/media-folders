name: Deploy to WordPress.org (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to deploy, for example v2.1.6
        required: true
        type: string
      confirm:
        description: Type DEPLOY to confirm WordPress.org deployment
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PHP_VERSION: '8.3'

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - name: Validate JavaScript, security and build assets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          npm ci
          npm run security:install-scripts
          npm run security:audit:runtime
          npm test -- --run
          npm run build
          npm run check:release-version
          npm run check:bundle-budget

      - name: Validate PHP
        run: |
          composer validate --strict
          composer install --prefer-dist --no-interaction --no-progress
          composer test
          composer audit --locked

      - name: Install production PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
