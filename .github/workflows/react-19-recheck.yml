name: Recheck React 19 compatibility

on:
  push:
    branches:
      - agent/react-19-recheck
    paths:
      - '.github/workflows/react-19-recheck.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/react-19-recheck

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Upgrade React host test peers
        run: |
          npm install --save-dev 'react@^19.2.8' 'react-dom@^19.2.8'
          npm dedupe

      - name: Validate React and WordPress host contract
        run: |
          npm ls react react-dom @wordpress/data @wordpress/element @wordpress/icons @testing-library/react @dnd-kit/core
          npm run check:engines
          npm run security:install-scripts
          npm audit --audit-level=low
          npm run security:audit:runtime
          npm run security:audit:dev-baseline
          npm run check:licenses
          npm test -- --run
          npm run build
          npm run check:release-version
          npm run check:bundle-budget
          echo '=== WordPress asset manifests ==='
          cat build/*.asset.php
          npm run --silent sbom:npm > /tmp/npm-runtime.cdx.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/npm-runtime.cdx.json', 'utf8'))"

      - name: Commit validated React 19 migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No React 19 migration changes produced.'
            exit 0
          fi
          git commit -m 'test: upgrade React test peers to 19'
          git push origin HEAD:agent/react-19-recheck
