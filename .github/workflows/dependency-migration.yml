name: Dependency migration bootstrap

on:
  push:
    branches:
      - agent/dependency-hygiene-bootstrap6

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: agent/dependency-hygiene-bootstrap6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Pin floating dependency specifications
        run: node scripts/migrate-dependencies.mjs

      - name: Refresh npm lockfile without breaking upgrades
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true

      - name: Validate JavaScript graph
        run: |
          npm ci
          npm test -- --run
          npm run build
          npm audit --json > /tmp/npm-audit.json || true

      - name: Validate PHP graph
        run: |
          composer validate --strict
          composer install --prefer-dist --no-interaction --no-progress
          composer test
          composer audit --locked --format=json > /tmp/composer-audit.json || true

      - name: Generate dependency baseline
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const audit = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          const composer = JSON.parse(fs.readFileSync('/tmp/composer-audit.json', 'utf8'));
          const v = audit.metadata?.vulnerabilities || {};
          const packageCount = Object.keys(lock.packages || {}).length - 1;
          const composerAdvisories = Object.values(composer.advisories || {}).flat().length;
          const lines = [
            '# Dependency baseline',
            '',
            'This file records the dependency baseline after the deterministic dependency migration.',
            '',
            '## Runtime policy',
            '',
            `- Node: ${pkg.engines?.node}`,
            `- npm: ${pkg.engines?.npm}`,
            '- PHP: >=8.3',
            '- JavaScript lockfile: package-lock.json (lockfileVersion 3)',
            '- PHP lockfile: composer.lock',
            '- Floating `latest` dependency specifications are prohibited.',
            '- `npm audit fix --force` is prohibited.',
            '- Major dependency upgrades must be isolated from feature changes.',
            '',
            '## Current graph',
            '',
            `- npm packages in lockfile: ${packageCount}`,
            `- npm vulnerabilities: ${v.total ?? 0} total (${v.critical ?? 0} critical, ${v.high ?? 0} high, ${v.moderate ?? 0} moderate, ${v.low ?? 0} low)`,
            `- Composer advisories: ${composerAdvisories}`,
            '',
            '## Direct npm runtime dependencies',
            '',
            ...Object.entries(pkg.dependencies || {}).sort().map(([name, version]) => `- \`${name}\`: \`${version}\``),
            '',
            '## Direct npm development dependencies',
            '',
            ...Object.entries(pkg.devDependencies || {}).sort().map(([name, version]) => `- \`${name}\`: \`${version}\``),
            '',
            '## Maintenance commands',
            '',
            '```bash',
            'npm run security:audit',
            'npm run security:audit:high',
            'npm run deps:outdated',
            'npm run deps:tree',
            'composer audit --locked',
            'composer outdated --direct',
            '```',
            '',
            'Security findings must be resolved through the dependency path that introduces them. Overrides require documentation and a removal condition.',
            '',
          ];
          fs.writeFileSync('docs/dependencies.md', lines.join('\n'));
          NODE

      - name: Commit resolver output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json docs/dependencies.md
          if git diff --cached --quiet; then
            echo 'No resolver changes to commit.'
            exit 0
          fi
          git commit -m 'chore: normalize dependency graph [deps-generated]'
          git push origin HEAD:agent/dependency-hygiene-bootstrap6
