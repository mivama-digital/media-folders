name: Toolchain lock refresh

on:
  push:
    branches:
      - agent/toolchain-debt
    paths:
      - '.github/workflows/toolchain-lock-refresh.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

env:
  NODE_VERSION: '24'

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/toolchain-debt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json is already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: regenerate focused toolchain lockfile'
          git push origin HEAD:agent/toolchain-debt
