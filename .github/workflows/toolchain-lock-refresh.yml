name: Toolchain migration validation

on:
  push:
    branches:
      - agent/toolchain-debt
    paths:
      - '.github/workflows/toolchain-lock-refresh.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'webpack.config.js'
      - 'scripts/check-engines.mjs'
      - 'scripts/check-licenses.mjs'
      - 'scripts/check-install-script-policy.mjs'
      - 'security/npm-audit-baseline.json'

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/toolchain-debt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install focused graph
        run: npm ci

      - name: Summarize focused graph
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const packages = Object.entries(lock.packages || {}).filter(([path]) => path);
          const installScripts = packages
            .filter(([, entry]) => entry.hasInstallScript && entry.version)
            .map(([path, entry]) => {
              const marker = 'node_modules/';
              const index = path.lastIndexOf(marker);
              const name = index === -1 ? path : path.slice(index + marker.length);
              return `${name}@${entry.version}`;
            });
          console.log(`locked packages: ${packages.length}`);
          console.log(`install-script packages: ${[...new Set(installScripts)].sort().join(', ')}`);
          NODE

      - name: Check engine contract
        run: npm run check:engines

      - name: Inspect install-script policy
        run: npm run security:install-scripts || true

      - name: Inspect full audit
        run: npm audit || true

      - name: Inspect runtime license policy
        run: npm run check:licenses || true

      - name: Run JavaScript tests
        run: npm test -- --run

      - name: Build production assets
        run: npm run build

      - name: Show generated asset contract
        run: |
          find build -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          for asset in build/*.asset.php; do
            echo "===== ${asset} ====="
            cat "${asset}"
          done

      - name: Validate release invariants
        run: |
          npm run check:release-version
          npm run check:bundle-budget
