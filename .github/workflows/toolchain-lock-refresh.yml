name: Commit focused production assets

on:
  push:
    branches:
      - agent/toolchain-debt
    paths:
      - '.github/workflows/toolchain-lock-refresh.yml'
      - 'scripts/check-licenses.mjs'

permissions:
  contents: write

env:
  NODE_VERSION: '24'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/toolchain-debt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install focused graph
        run: npm ci

      - name: Verify dependency policy
        run: |
          npm run check:engines
          npm run security:install-scripts
          npm run security:audit:runtime
          npm run security:audit:dev-baseline
          npm run check:licenses

      - name: Run JavaScript tests
        run: npm test -- --run

      - name: Build production assets
        run: npm run build

      - name: Verify generated assets
        run: |
          npm run check:release-version
          npm run check:bundle-budget
          test -f build/admin.asset.php
          test -f build/admin-rtl.css
          test -f build/editor.asset.php
          test -f build/editor-rtl.css
          test -f build/shared.asset.php
          test -f build/shared-rtl.css

      - name: Commit generated production assets
        run: |
          if git diff --quiet -- build; then
            echo 'Generated build artifacts are already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build
          git commit -m 'build: regenerate focused production assets'
          git push origin HEAD:agent/toolchain-debt
