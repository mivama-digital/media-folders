version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      wordpress-runtime:
        patterns:
          - "@wordpress/api-fetch"
          - "@wordpress/components"
          - "@wordpress/data"
          - "@wordpress/element"
          - "@wordpress/i18n"
          - "@wordpress/icons"
        update-types:
          - "minor"
          - "patch"
      wordpress-toolchain:
        dependency-type: "development"
        patterns:
          - "@wordpress/scripts"
        update-types:
          - "minor"
          - "patch"
      dnd-runtime:
        dependency-type: "production"
        patterns:
          - "@dnd-kit/*"
        update-types:
          - "minor"
          - "patch"
      javascript-testing:
        dependency-type: "development"
        patterns:
          - "@testing-library/*"
          - "@vitejs/plugin-react"
          - "jsdom"
          - "react"
          - "react-dom"
          - "vitest"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      composer-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
